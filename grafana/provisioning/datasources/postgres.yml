apiVersion: 1

datasources:
  - name: Spec-kit Telemetry (Postgres)
    type: postgres
    access: proxy
    url: postgres:5432
    database: telemetry
    user: telemetry
    isDefault: true
    editable: true
    jsonData:
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
    secureJsonData:
      password: telemetry
